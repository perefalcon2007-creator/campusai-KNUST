<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CampusAI KNUST</title>
<link rel="stylesheet" href="./cwa.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{
  margin:0;
  background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('./knust-gate.jpg');
  background-size: cover;background-position: center top;background-repeat: no-repeat;background-attachment: fixed;
  min-height:100vh;
}
.header{color:white;text-align:center;margin:20px 0}
.main-wrap{width:98%;max-width:1450px;margin:0 auto;display:flex;gap:16px;align-items:flex-start}
.left-panel{flex:0 0 340px;position:sticky;top:20px}
.chat-box{flex:1;background:white;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column;height:560px;min-width:360px}
.chat-top{padding:12px 18px;background:#f8f9fa;border-bottom:1px solid #eee;font-weight:700;display:flex;justify-content:space-between}
.messages{flex:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{padding:10px 14px;border-radius:18px;max-width:85%;font-size:14px;line-height:1.4;white-space:pre-wrap}
.bot{background:#f1f5f9;align-self:flex-start}
.user{background:#2563eb;color:white;align-self:flex-end}
.input-area{padding:14px;border-top:1px solid #eee;display:flex;gap:10px}
.input-area input{flex:1;padding:12px 16px;border-radius:999px;border:1px solid #ddd;outline:none}
.input-area button{padding:12px 20px;border-radius:999px;border:none;background:#2563eb;color:white;font-weight:700;cursor:pointer}
.right-panel{flex:0 0 300px;display:flex;flex-direction:column;gap:12px;position:sticky;top:20px}
.card-box{background:white;border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
@media(max-width:1100px){.main-wrap{flex-direction:column}.left-panel,.chat-box,.right-panel{width:100%;position:static}}
</style>
</head>
<body>
<div class="header"><h1>CampusAI 🎓</h1><p>Built by PereFalc - KNUST 2026/27</p></div>

<div class="main-wrap">

  <!-- LEFT = YOUR CWA CALCULATOR (Independent) -->
  <div class="left-panel">
    <div id="cwaCalculator"></div>
    <!-- Your cwa.js will automatically fill this div -->
  </div>

  <!-- MIDDLE = CHAT (Shifted Right) -->
  <div class="chat-box">
    <div class="chat-top"><span>🟢 CampusAI - Live</span><span style="font-size:11px;color:#22c55e">● Global</span></div>
    <div class="messages" id="messages"><div class="msg bot">Hi! I'm your KNUST guide. Ask about hostels, fees, cut-off... 🇬🇭</div></div>
    <div class="input-area"><input id="q" placeholder="Ask something..."><button id="sendBtn">Send</button></div>
  </div>

  <!-- RIGHT = QUICK ACTIONS -->
  <div class="right-panel">
    <div class="card-box"><h4>📌 Last Message</h4><div id="lastMsg" style="font-size:13px;background:#f8fafc;padding:10px;border-radius:10px">No message yet.</div></div>
    <div class="card-box"><h4>⚡ Quick Actions</h4>
      <div onclick="quickAsk('Hostel price in Ayeduase?')" style="padding:10px;border:1px solid #eee;border-radius:8px;margin-bottom:8px;cursor:pointer">🏠 Hostel Prices</div>
      <div onclick="quickAsk('KNUST hall fees 2167.80')" style="padding:10px;border:1px solid #eee;border-radius:8px;cursor:pointer">💰 Hall Fees 2167</div>
    </div>
  </div>

</div>

<script>
function quickAsk(t){document.getElementById('q').value=t; send();}
async function send(){
  const input=document.getElementById('q'); const box=document.getElementById('messages'); const last=document.getElementById('lastMsg');
  const text=input.value.trim(); if(!text) return;
  const u=document.createElement('div'); u.className='msg user'; u.textContent=text; box.appendChild(u); input.value=''; last.textContent=text;
  box.scrollTop=box.scrollHeight; const load=document.createElement('div'); load.className='msg bot'; load.textContent='Typing...'; box.appendChild(load);
  try{ const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})}); const d=await r.json(); load.textContent=d.reply||'Error'; }catch(e){ load.textContent='Network error'; } box.scrollTop=box.scrollHeight;
}
document.getElementById('sendBtn').addEventListener('click',send);
document.getElementById('q').addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
</script>

<!-- YOUR CALCULATOR FILES - Independent -->
<script src="./cwa.js"></script>
</body>
</html>
