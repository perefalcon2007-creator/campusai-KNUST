<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusAI KNUST</title>
<link rel="stylesheet" href="./cwa.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Segoe UI,sans-serif}
body{
  background: linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.35)), url('./knust-gate.jpg');
  background-size:cover;background-position:center top;background-attachment:fixed;
  min-height:100vh;padding:20px;
}
.top{color:white;text-align:center;margin-bottom:20px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.top h1{font-size:28px} .top p{opacity:.9}
.layout{max-width:1500px;margin:0 auto;display:flex;gap:18px;align-items:flex-start}
.left{flex:0 0 380px;position:sticky;top:20px}
.center{flex:1;min-width:380px;display:flex;flex-direction:column;gap:14px}
.chat{background:white;border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;height:620px}
.chat-head{padding:14px 18px;background:#f8fafc;border-bottom:1px solid #eee;font-weight:800;display:flex;justify-content:space-between}
.msgs{flex:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;background:white}
.msg{padding:11px 14px;border-radius:18px;max-width:88%;font-size:14px;line-height:1.45;white-space:pre-wrap}
.bot{background:#f1f5f9} .user{background:#2563eb;color:white;align-self:flex-end}
.input{padding:12px;border-top:1px solid #eee;display:flex;gap:10px}
.input input{flex:1;padding:12px 16px;border-radius:999px;border:1px solid #ddd;outline:none}
.input button{padding:12px 22px;border-radius:999px;border:none;background:#2563eb;color:white;font-weight:800;cursor:pointer}
.quick-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.q-card{background:white;border-radius:14px;padding:14px;box-shadow:0 10px 25px rgba(0,0,0,.25);cursor:pointer;border:1px solid #eef2ff;font-weight:600;text-align:center}
.q-card:hover{background:#eff6ff}
.right{flex:0 0 300px;position:sticky;top:20px;display:flex;flex-direction:column;gap:12px}
.card{background:white;border-radius:14px;padding:16px;box-shadow:0 10px 25px rgba(0,0,0,.25)}
@media(max-width:1150px){.layout{flex-direction:column}.left,.center,.right{width:100%;position:static}.chat{height:500px}.quick-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="top"><h1>CampusAI 🎓</h1><p>Built by PereFalc - KNUST 2026/27</p></div>

<div class="layout">

  <!-- LEFT: CWA CALCULATOR - Independent, not chatbot controlled -->
  <div class="left">
    <div id="cwaCalculator"></div>
  </div>

  <!-- CENTER: CHAT + 3 QUICK ACTIONS BELOW -->
  <div class="center">
    <div class="chat">
      <div class="chat-head"><span>🟢 CampusAI - Live</span><span style="font-size:11px;color:#22c55e">● Global</span></div>
      <div class="msgs" id="msgs"><div class="msg bot">Hey there! 👋 What can I help you with today? Ask about hostels, fees, CWA... 🇬🇭</div></div>
      <div class="input"><input id="q" placeholder="Ask something..."><button id="send">Send</button></div>
    </div>

    <!-- THE 3 QUICK ACTIONS YOU ASKED FOR - BELOW CHAT -->
    <div class="quick-row">
      <div class="q-card" onclick="quick('Hostel price in Ayeduase?')">🏠 Hostel Prices</div>
      <div class="q-card" onclick="quick('KNUST hall fees 2167.80 for 2024/25?')">💰 Hall Fees</div>
      <div class="q-card" onclick="quick('Calculate my CWA, I had 68, 72, 80')">📊 Calculate CWA</div>
    </div>
  </div>

  <!-- RIGHT: LAST MESSAGE ETC -->
  <div class="right">
    <div class="card"><h4>📌 Last Message</h4><div id="lastMsg" style="margin-top:8px;font-size:13px;background:#f8fafc;padding:10px;border-radius:10px">yo</div></div>
    <div class="card"><h4>⚡ Quick Actions</h4>
      <div onclick="quick('Hostel price')" style="padding:8px;border:1px solid #eee;border-radius:8px;margin-top:8px;cursor:pointer">🏠 Hostel Prices</div>
      <div onclick="quick('Hall Fees 2167')" style="padding:8px;border:1px solid #eee;border-radius:8px;margin-top:8px;cursor:pointer">🔥 Hall Fees 2167</div>
    </div>
  </div>

</div>

<script>
function quick(t){document.getElementById('q').value=t; send();}
async function send(){
  const inp=document.getElementById('q'), box=document.getElementById('msgs'), last=document.getElementById('lastMsg');
  const txt=inp.value.trim(); if(!txt) return;
  const u=document.createElement('div'); u.className='msg user'; u.textContent=txt; box.appendChild(u); inp.value=''; last.textContent=txt; box.scrollTop=box.scrollHeight;
  const b=document.createElement('div'); b.className='msg bot'; b.textContent='Typing...'; box.appendChild(b); box.scrollTop=box.scrollHeight;
  try{ const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:txt})}); const d=await r.json(); b.textContent=d.reply||'Error'; }catch(e){ b.textContent='Network error - check /api/chat'; } box.scrollTop=box.scrollHeight;
}
document.getElementById('send').onclick=send;
document.getElementById('q').addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
</script>

<!-- LOAD YOUR CALCULATOR FILES -->
<script src="./cwa.js"></script>
</body>
</html>
